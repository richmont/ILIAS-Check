[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ilias-check"
version = "0.1.0"
description = "Read-only inventory collector for authorized ILIAS repositories"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "python-dotenv>=1.0,<2",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
test = [
  "jsonschema>=4.20,<5",
  "pytest>=8,<9",
]

[project.scripts]
ilias-check = "ilias_check.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
